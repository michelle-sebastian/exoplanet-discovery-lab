name: Refresh NASA planet data

on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-nasa-planet-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch and validate NASA catalog
        run: python3 data-scripts/fetch_planets.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit updated snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/planets.json src/data/dataset-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/planets.json src/data/dataset-meta.json
          git commit -m "chore(data): refresh NASA exoplanet catalog"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook if configured
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 --request POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          fi
